[package]
name    = "chacha20blake3"
version = "0.1.0"
edition = "2021"

[lib]
name       = "chacha20blake3"
crate-type = ["cdylib", "rlib"]

[dependencies]
chacha20-blake3 = "0.10.0"
blake3          = { version = "1", features = ["std"] }
